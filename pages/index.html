<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nørd examples</title>
        <style>
            :root {
                color: #f2f3f7;
                background: #2d303d;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                background:
                    radial-gradient(circle at 15% 10%, rgb(110 245 214 / 18%), transparent 26rem),
                    radial-gradient(circle at 85% 0%, rgb(184 105 255 / 20%), transparent 28rem), #20222c;
            }

            main {
                width: min(100% - 3rem, 68rem);
                margin: 0 auto;
                padding: clamp(4rem, 12vw, 8rem) 0;
            }

            .eyebrow {
                margin: 0 0 1rem;
                color: #8ef1dc;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.8rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            h1 {
                max-width: 12ch;
                margin: 0;
                background: linear-gradient(110deg, #8ef1dc, #bd7cff);
                background-clip: text;
                color: transparent;
                font-size: clamp(3.5rem, 9vw, 7rem);
                letter-spacing: -0.07em;
                line-height: 0.9;
            }

            .intro {
                max-width: 38rem;
                margin: 1.75rem 0 3rem;
                color: #c5c8d4;
                font-size: clamp(1.05rem, 2vw, 1.25rem);
                line-height: 1.6;
            }

            ul {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
                gap: 1rem;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            a {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 6rem;
                padding: 1.25rem;
                border: 1px solid rgb(255 255 255 / 12%);
                border-radius: 1rem;
                background: rgb(255 255 255 / 6%);
                color: inherit;
                font-size: 1.1rem;
                font-weight: 700;
                text-decoration: none;
                transition:
                    border-color 160ms ease,
                    background 160ms ease,
                    transform 160ms ease;
            }

            a::after {
                content: '↗';
                color: #8ef1dc;
                font-size: 1.4rem;
            }

            a:hover,
            a:focus-visible {
                border-color: rgb(142 241 220 / 60%);
                background: rgb(255 255 255 / 11%);
                outline: none;
                transform: translateY(-0.2rem);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Nørd examples</h1>
            <p class="intro">Small applications built with Nørd. Pick one, open the source, and make it your own.</p>
            <ul aria-label="Examples">
                <li><a href="./forms/">Forms</a></li>
                <li><a href="./game-of-life/">Game of Life</a></li>
                <li><a href="./hnr/">Hacker News Reader</a></li>
                <li><a href="./minesweeper/">Minesweeper</a></li>
                <li><a href="./tic-tac-toe/">Tic-Tac-Toe</a></li>
            </ul>
        </main>
    </body>
</html>
